; Bongo Cat for the 2.8" ESP32-32E (USB-C only) Cheap Yellow Display
; Build + flash from the repo root:  pio run -t upload && pio device monitor
; Uses the repo's own User_Setup.h (TFT_eSPI) and lv_conf.h (LVGL 8).

[platformio]
src_dir = .
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<bongo_cat.ino.cpp>
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11
build_flags =
  -DUSER_SETUP_LOADED=1
  -include ${PROJECT_DIR}/User_Setup.h
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}
